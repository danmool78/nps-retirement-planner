# 정적 사이트(GitHub Pages) 배포. 서버 없이 index.html 이 stlite 로 앱을 브라우저에서 실행한다.
# 저장소 Settings → Pages → Source 를 'GitHub Actions' 로 한 번 설정해야 한다.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp index.html *.py policy.json manifest.webmanifest sw.js _site/
          cp -r icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
